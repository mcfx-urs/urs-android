org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
# KSP (first annotation processor in this repo, added for Room) still adds
# its generated source dirs via the older kotlin.sourceSets DSL, which AGP's
# newer built-in-Kotlin compilation (used here instead of a separate
# org.jetbrains.kotlin.android plugin) rejects by default as of AGP 9.x.
# Suppresses that check rather than working around it, per AGP's own
# documented escape hatch, until KSP ships full built-in-Kotlin support.
android.disallowKotlinSourceSets=false
